global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'source']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 4h
  receiver: 'freshness-default'
  routes:
    - match:
        severity: critical
      receiver: 'freshness-critical'
      repeat_interval: 1h

receivers:
  - name: 'freshness-default'
    # Webhook receiver for warning and recovery alerts
    webhook_configs:
      - url: 'http://app:8000/api/devops/alerts'
        send_resolved: true

  - name: 'freshness-critical'
    # Dedicated receiver for critical freshness failures
    webhook_configs:
      - url: 'http://app:8000/api/devops/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'source']
