services:
  app:
    image: ${DEPLOY_IMAGE}
    container_name: smart_cassavas_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-quanly_toanha}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-123567}
      - RUN_MIGRATIONS=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cassavas_network

  db:
    image: mysql:8.0
    container_name: smart_cassavas_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-name-resolve
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-123567}
      - MYSQL_DATABASE=${DB_DATABASE:-quanly_toanha}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - cassavas_network

volumes:
  mysql_prod_data:
    driver: local

networks:
  cassavas_network:
    driver: bridge
