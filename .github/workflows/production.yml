name: CD - Production Deployment

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag or Image SHA to deploy to Production'
        required: true
        default: 'production'

concurrency:
  group: cd-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-production:
    name: Build & Push Production Image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine Image Release Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "image_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [build-and-push-production]
    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate Production Server Credentials
        id: check-secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_HOST" ] || [ -z "$PROD_USER" ] || [ -z "$PROD_SSH_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::PRODUCTION DEPLOYMENT NOT CONFIGURED: Awaiting PROD_HOST, PROD_USER, PROD_SSH_KEY secrets."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Production Server via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-push-production.outputs.image_tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          envs: REGISTRY,IMAGE_NAME,RELEASE_TAG,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.PROD_APP_PATH || '/var/www/smart-cassavas' }}"
            cd "$APP_PATH"
            chmod +x scripts/*.sh || true
            ./scripts/deploy.sh "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}"

      - name: Production Deployment Status Report
        run: |
          echo "========================================================================"
          if [ "${{ steps.check-secrets.outputs.configured }}" = "true" ]; then
            echo "🚀 PRODUCTION DEPLOYMENT COMPLETED"
            echo "Release Image: ghcr.io/${{ github.repository }}:${{ needs.build-and-push-production.outputs.image_tag }}"
          else
            echo "⚠️ PRODUCTION DEPLOYMENT SKIPPED: Server credentials (PROD_HOST/PROD_USER/PROD_SSH_KEY) are not configured."
            echo "Image has been built and pushed to GHCR: ghcr.io/${{ github.repository }}:${{ needs.build-and-push-production.outputs.image_tag }}"
          fi
          echo "========================================================================"
