name: CD - Production Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0, v1.0.1)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: cd-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci-gate:
    name: Production Release CI Gate (Verification)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: quanly_toanha_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, iconv, intl, bcmath, gd, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint Check
        run: vendor/bin/pint --test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npm run typecheck

      - name: Build Frontend Assets
        run: npm run build

      - name: Configure Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for MySQL Service
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; then
              echo "MySQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL service failed to start."
          exit 1

      - name: Run Migrations & Seed
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quanly_toanha_test
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction

      - name: Run PHPUnit Test Suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quanly_toanha_test
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
          APP_ENV: testing
        run: vendor/bin/phpunit --colors=always

  build-and-push-production:
    name: Build & Push Production Release Image (GHCR)
    runs-on: ubuntu-latest
    needs: [ci-gate]
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      build_time: ${{ steps.tag.outputs.build_time }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine Image Release Tag
        id: tag
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v-${SHORT_SHA}"
          fi

          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: true
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.image_tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.tag.outputs.build_time }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.tag.outputs.short_sha }}
            ghcr.io/${{ github.repository }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Server (Environment Protection Gate)
    runs-on: ubuntu-latest
    needs: [build-and-push-production]
    environment:
      name: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate Production Server Credentials
        id: check-secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_HOST" ] || [ "$PROD_HOST" = "not_configured" ] || [ -z "$PROD_USER" ] || [ "$PROD_USER" = "not_configured" ] || [ -z "$PROD_SSH_KEY" ] || [ "$PROD_SSH_KEY" = "not_configured" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::DEPLOYMENT STATUS: NOT CONFIGURED. Production server credentials (PROD_HOST, PROD_USER, PROD_SSH_KEY) are awaiting setup in GitHub Secrets."
            echo "Final Status: NOT_CONFIGURED"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Production Server via SSH
        id: ssh-deploy
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-push-production.outputs.image_tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          envs: REGISTRY,IMAGE_NAME,RELEASE_TAG,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.PROD_APP_PATH || '/var/www/smart-cassavas' }}"
            cd "$APP_PATH"
            chmod +x scripts/*.sh || true
            ./scripts/deploy.sh "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}" production

      - name: Production Deployment Status Report
        if: always()
        run: |
          CONFIGURED="${{ steps.check-secrets.outputs.configured }}"
          SSH_OUTCOME="${{ steps.ssh-deploy.outcome }}"

          echo "========================================================================"
          echo "DEPLOYMENT STAGE OUTCOME EVALUATION:"
          echo "1. BUILD_STATUS:     SUCCESS (ghcr.io/${{ github.repository }}:${{ needs.build-and-push-production.outputs.image_tag }})"

          if [ "$CONFIGURED" != "true" ]; then
            echo "2. DEPLOY_STATUS:    SKIPPED (Production server credentials not configured)"
            echo "ℹ️ OVERALL RESULT: BUILD VERIFIED & DEPLOYMENT SKIPPED (Awaiting server credentials)"
            exit 0
          elif [ "$SSH_OUTCOME" = "success" ]; then
            echo "2. DEPLOY_STATUS:    SUCCESS (SSH executed deploy.sh with target image)"
            echo "3. VERIFY_STATUS:    PASSED (Health, Smoke & Freshness verified)"
            echo "🚀 OVERALL RESULT: PRODUCTION DEPLOYMENT COMPLETED & VERIFIED"
            exit 0
          else
            echo "2. DEPLOY_STATUS:    FAILED (SSH deployment failed with outcome: $SSH_OUTCOME)"
            echo "🚨 OVERALL RESULT: PRODUCTION DEPLOYMENT FAILED"
            exit 1
          fi
          echo "========================================================================"
