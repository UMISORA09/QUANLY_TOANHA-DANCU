name: Security & Vulnerability Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Quét bảo mật tự động lúc 02:00 UTC thứ 2 hàng tuần
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret & Credential Leak Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-audit:
    name: Dependency Vulnerability Audit (Composer & NPM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Run Composer Audit
        run: |
          echo "Kiểm tra lỗ hổng thư viện PHP Composer..."
          composer audit --no-interaction || echo "::warning ::Phát hiện cảnh báo bảo mật trong thư viện Composer."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Run NPM Audit
        run: |
          echo "Kiểm tra lỗ hổng thư viện Frontend Node.js..."
          npm audit --audit-level=high || echo "::warning ::Phát hiện cảnh báo bảo mật trong npm packages."

  container-security-scan:
    name: Docker Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Image for Scanning
        run: |
          docker build -t smart-cassavas:security-scan -f docker/app/Dockerfile --target production .

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smart-cassavas:security-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
