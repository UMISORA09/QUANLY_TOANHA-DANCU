name: CD - Staging Deployment

on:
  workflow_run:
    workflows: ["Docker Build & GHCR Publish"]
    branches: [main, master, develop]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g., sha-xxxxxxx or latest)'
        required: false
        default: 'latest'

concurrency:
  group: cd-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Image Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "image_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Validate Staging Credentials
        id: check-secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning ::CD deployment is configured but requires staging server credentials."
            echo "Please configure STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_APP_PATH in GitHub Repository Environments -> staging."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Staging Server via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          envs: REGISTRY,IMAGE_NAME,IMAGE_TAG,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.STAGING_APP_PATH || '/var/www/smart-cassavas' }}"
            cd "$APP_PATH"
            chmod +x scripts/*.sh || true
            ./scripts/deploy.sh "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Deployment Report (Awaiting Credentials)
        if: steps.check-secrets.outputs.configured != 'true'
        run: |
          echo "========================================================================"
          echo "STAGING DEPLOYMENT STATUS: AWAITING SERVER CREDENTIALS"
          echo "========================================================================"
          echo "The Staging CD pipeline is fully configured and ready."
          echo "Target Image: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.image_tag }}"
          echo "To enable automated deployment, add the following secrets to 'staging' environment:"
          echo " - STAGING_HOST"
          echo " - STAGING_PORT (optional, default 22)"
          echo " - STAGING_USER"
          echo " - STAGING_SSH_KEY"
          echo " - STAGING_APP_PATH"
          echo "========================================================================"
