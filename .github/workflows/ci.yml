name: CI - Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint Check
        run: vendor/bin/pint --test

  frontend-ci:
    name: Frontend CI (TypeCheck & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npm run typecheck

      - name: Build Frontend Assets
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f public/build/manifest.json || { echo "Missing manifest.json"; exit 1; }
          ls -lh public/build/assets/

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-artifacts
          path: public/build/
          retention-days: 7

  backend-test:
    name: Backend Test & DB Migrations (PHPUnit & MySQL 8.0)
    runs-on: ubuntu-latest
    needs: [php-lint, frontend-ci]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: quanly_toanha_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, iconv, intl, bcmath, gd, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Download Frontend Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-artifacts
          path: public/build

      - name: Configure Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for MySQL Service
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; then
              echo "MySQL is ready and accepting connections."
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL service failed to start in time."
          exit 1

      - name: Database Startup, Migration, Rollback & Re-migration
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quanly_toanha_test
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
        run: |
          echo "1. Run initial migrations"
          php artisan migrate --force --no-interaction
          echo "2. Test rollback 1 step"
          php artisan migrate:rollback --step=1 --force --no-interaction
          echo "3. Re-migrate to latest schema"
          php artisan migrate --force --no-interaction

      - name: Database Seeding Verification
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quanly_toanha_test
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
        run: |
          echo "Seed database tables via DatabaseSeeder"
          php artisan db:seed --force --no-interaction

      - name: Run PHPUnit Test Suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quanly_toanha_test
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
          APP_ENV: testing
        run: vendor/bin/phpunit --colors=always --log-junit phpunit-report.xml

      - name: Upload PHPUnit Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-test-results
          path: phpunit-report.xml
          retention-days: 7

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer Vulnerability Audit
        run: composer audit --locked --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: NPM Package Audit
        run: npm audit --audit-level=high

  docker-verification:
    name: Docker Build & Container Smoke Test
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          load: true
          tags: smart-cassavas:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Production Container for Smoke Test
        run: |
          docker run -d --name smoke_app -p 8000:8000 \
            -e APP_ENV=production \
            -e APP_KEY=base64:6bW+uN89m43gZpP5xLqA7K2s8D9F0G1H2J3K4L5M6N7= \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/var/www/html/database/database.sqlite \
            -e SESSION_DRIVER=file \
            -e CACHE_STORE=file \
            -e RUN_MIGRATIONS=false \
            smart-cassavas:smoke-test

      - name: Run Container Health & Smoke Test
        run: |
          echo "Waiting for container startup and probing health endpoints..."
          for i in {1..30}; do
            UP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up || echo "000")
            HEALTH_RESP=$(curl -s http://127.0.0.1:8000/health || echo "")

            if [ "$UP_STATUS" = "200" ] && echo "$HEALTH_RESP" | grep -q '"status"'; then
              echo "✅ Container Smoke Test Passed!"
              echo "Endpoint /up: HTTP $UP_STATUS"
              echo "Endpoint /health: $HEALTH_RESP"
              docker stop smoke_app && docker rm smoke_app
              exit 0
            fi
            echo "Attempt $i: /up status=$UP_STATUS, /health response=$HEALTH_RESP. Retrying in 2s..."
            sleep 2
          done

          echo "❌ Container Smoke Test Timed Out. Container logs:"
          docker logs smoke_app
          docker stop smoke_app && docker rm smoke_app
          exit 1

  ci-status:
    name: CI Pipeline Status Check
    runs-on: ubuntu-latest
    needs: [php-lint, frontend-ci, backend-test, security-scan, docker-verification]
    if: always()
    steps:
      - name: Evaluate Core CI Stage Outcomes
        run: |
          LINT="${{ needs.php-lint.result }}"
          FRONTEND="${{ needs.frontend-ci.result }}"
          BACKEND="${{ needs.backend-test.result }}"
          SECURITY="${{ needs.security-scan.result }}"
          DOCKER="${{ needs.docker-verification.result }}"

          echo "=== CI Pipeline Results Summary ==="
          echo "PHP Lint (Pint):        $LINT"
          echo "Frontend CI:             $FRONTEND"
          echo "Backend Tests & DB:      $BACKEND"
          echo "Security Vulnerabilities:$SECURITY"
          echo "Docker Verification:     $DOCKER"
          echo "==================================="

          FAILED_STAGES=()
          [ "$LINT" != "success" ] && FAILED_STAGES+=("PHP Lint ($LINT)")
          [ "$FRONTEND" != "success" ] && FAILED_STAGES+=("Frontend CI ($FRONTEND)")
          [ "$BACKEND" != "success" ] && FAILED_STAGES+=("Backend Tests & DB ($BACKEND)")
          [ "$SECURITY" != "success" ] && FAILED_STAGES+=("Security Vulnerabilities ($SECURITY)")
          [ "$DOCKER" != "success" ] && FAILED_STAGES+=("Docker Verification ($DOCKER)")

          if [ ${#FAILED_STAGES[@]} -gt 0 ]; then
            echo "❌ CI FAILED: The following required stages did not succeed:"
            for stage in "${FAILED_STAGES[@]}"; do
              echo "  - $stage"
            done
            exit 1
          fi

          echo "✅ All Core CI Checks Passed: Lint ✓ Frontend ✓ Backend/DB ✓ Security ✓ Docker Verification ✓"
