name: Docker Verification & Manual Publish

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build Production Image & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata (Tags & OCI Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Load Image for Local Smoke Test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Smoke Test on Container
        run: |
          echo "Starting test container with mock SQLite database for container self-test..."
          docker run -d --name smoke_app -p 8000:8000 \
            -e APP_ENV=production \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/var/www/html/database/database.sqlite \
            -e SESSION_DRIVER=file \
            -e CACHE_STORE=file \
            -e RUN_MIGRATIONS=false \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:smoke-test

          echo "Waiting for container startup..."
          for i in {1..30}; do
            RESP=$(curl -s http://127.0.0.1:8000/health || echo "")
            UP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up || echo "000")
            if [ "$UP_STATUS" = "200" ] || echo "$RESP" | grep -q '"status":"healthy"'; then
              echo "Container health check passed! (/up: HTTP $UP_STATUS, /health: $RESP)"
              docker stop smoke_app && docker rm smoke_app
              exit 0
            fi
            echo "Attempt $i waiting, current response: $RESP"
            sleep 2
          done

          echo "Container health check timed out. Container logs:"
          docker logs smoke_app
          docker stop smoke_app && docker rm smoke_app
          exit 1

      - name: Build and Push Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
