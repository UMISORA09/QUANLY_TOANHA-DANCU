name: Amenity Search Synchronization

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      reindex:
        description: 'Import the current production search documents before processing jobs'
        type: boolean
        default: false
      retry_failed_only:
        description: 'Retry only failed search jobs without enqueueing a new backfill'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amenity-search-sync-production
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.AMENITY_ELASTICSEARCH_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALL_SEARCH_QUEUES: 'true'
      SYNC_SECRET: ${{ secrets.AMENITY_SEARCH_SYNC_SECRET }}
      BASE_URL: ${{ vars.PRODUCTION_URL || 'https://quanly-toanha-dancu.vercel.app' }}
      REINDEX: ${{ inputs.reindex || false }}
      RETRY_FAILED_ONLY: ${{ inputs.retry_failed_only || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify readiness and process the Elasticsearch search queues
        run: node scripts/amenity-search-sync.mjs
