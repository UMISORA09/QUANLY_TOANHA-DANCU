name: Amenity Search Synchronization

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      reindex:
        description: 'Import the current production amenities before processing jobs'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amenity-search-sync-production
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNC_SECRET: ${{ secrets.AMENITY_SEARCH_SYNC_SECRET }}
      BASE_URL: ${{ vars.PRODUCTION_URL || 'https://quanly-toanha-dancu.vercel.app' }}
      REINDEX: ${{ inputs.reindex || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify readiness and process only the amenity-search queue
        run: node scripts/amenity-search-sync.mjs
