name: CD - Staging Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-xxxxxxx or staging)'
        required: false
        default: 'staging'

concurrency:
  group: cd-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-staging:
    name: Build & Push Staging Image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Image Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "image_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Staging Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [build-and-push-staging]
    environment:
      name: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Staging Server Credentials
        id: check-secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::STAGING DEPLOYMENT NOT CONFIGURED: Awaiting STAGING_HOST, STAGING_USER, STAGING_SSH_KEY secrets."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Staging Server via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          IMAGE_TAG: ${{ needs.build-and-push-staging.outputs.image_tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          envs: REGISTRY,IMAGE_NAME,IMAGE_TAG,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.STAGING_APP_PATH || '/var/www/smart-cassavas' }}"
            cd "$APP_PATH"
            chmod +x scripts/*.sh || true
            ./scripts/deploy.sh "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Staging Deployment Status Report
        run: |
          echo "========================================================================"
          if [ "${{ steps.check-secrets.outputs.configured }}" = "true" ]; then
            echo "✅ STAGING PIPELINE COMPLETED"
            echo "Target Image: ghcr.io/${{ github.repository }}:${{ needs.build-and-push-staging.outputs.image_tag }}"
          else
            echo "⚠️ STAGING DEPLOYMENT SKIPPED: Server credentials (STAGING_HOST/STAGING_USER/STAGING_SSH_KEY) are not configured."
            echo "Image has been built and pushed to GHCR: ghcr.io/${{ github.repository }}:${{ needs.build-and-push-staging.outputs.image_tag }}"
          fi
          echo "========================================================================"
