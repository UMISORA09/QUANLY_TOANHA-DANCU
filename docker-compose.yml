services:
  app:
    image: quanly_toanha-dancu-app:latest
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    entrypoint: ["bash", "/var/www/html/docker/app/entrypoint.sh"]
    container_name: smart_cassavas_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=quanly_toanha
      - DB_USERNAME=root
      - DB_PASSWORD=123567
      - SESSION_DRIVER=file
      - CACHE_STORE=redis
      - PHP_CLI_SERVER_WORKERS=8
      - QUEUE_CONNECTION=sync
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_DEV_INIT=${RUN_DEV_INIT:-true}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      - SEED_CLASS=${SEED_CLASS:-Database\Seeders\DatabaseSeeder}
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cassavas_network

  scheduler:
    image: quanly_toanha-dancu-app:latest
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    entrypoint: ["bash", "/var/www/html/docker/app/entrypoint.sh"]
    container_name: smart_cassavas_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=quanly_toanha
      - DB_USERNAME=root
      - DB_PASSWORD=123567
      - CACHE_STORE=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_DEV_INIT=false
      - RUN_MIGRATIONS=false
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cassavas_network

  db:
    image: mysql:8.0
    container_name: smart_cassavas_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-name-resolve --innodb-buffer-pool-size=256M --innodb-log-buffer-size=16M --innodb-flush-log-at-trx-commit=2
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123567
      - MYSQL_DATABASE=quanly_toanha
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dump_quanly_toanha.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p123567 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - cassavas_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: smart_cassavas_phpmyadmin
    restart: unless-stopped
    ports:
      - "8888:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=123567
      - UPLOAD_LIMIT=128M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cassavas_network

  redis:
    image: redis:7.4-alpine
    container_name: smart_cassavas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cassavas_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  cassavas_network:
    driver: bridge
